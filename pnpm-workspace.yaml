packages:
  - 'packages/*'
  - 'api-contract'
  - 'examples/*'
allowBuilds:
  esbuild: true
# Force patched transitive deps (prod audit gates CI on high+). hono/@hono/node-server arrive via the
# MCP SDK's HTTP transport (never loaded — our MCP server is stdio-only, so they're runtime-inert);
# ws/axios are kept as a safety net for any transitive pull.
overrides:
  ws: '>=8.21.0'
  axios: '>=1.18.1'
  hono: '>=4.12.27'
  '@hono/node-server': '>=2.0.10'
  # fast-uri <3.1.4: host-confusion via backslash authority delimiter + failed IDN canonicalization
  # (2 HIGH advisories). Transitive via @modelcontextprotocol/sdk → ajv. Patched >=3.1.4. Pin the 3.x
  # line ajv expects, not the 4.x major. Dependabot cannot fix this itself (security_update_not_possible
  # — it only bumps direct deps, and the top-level resolvable version is 3.1.2).
  fast-uri: '^3.1.4'
  # dev-only advisories (Dependabot repo badge): vite path-traversal/fs.deny + esbuild dev-server
  vite: '>=6.4.3'
  esbuild: '>=0.28.1'
  # postcss <=8.5.17: path traversal via sourceMappingURL auto-loading a previous source map →
  # arbitrary .map disclosure. Dev-scope only (tsup → postcss-load-config, vite → postcss), so the
  # --prod audit gate never saw it; pinned anyway to keep the badge clean. Patched >=8.5.18.
  postcss: '>=8.5.18'

# client/ is the Flutter app (Dart), not a pnpm workspace member.
